# ==============================================================================
# Streamlit Community Cloud & Production Configuration
# .streamlit/config.toml
# ==============================================================================

[theme]
primaryColor = "#2563EB"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#161B22"
textColor = "#FFFFFF"
font = "sans serif"

[server]
port = 8501
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 50

[browser]
gatherUsageStats = false
