  revenue_target: "Line_Total"
  quantity_target: "Quantity"
  leakage_columns_to_drop:
    - "COS"
    - "GP"
    - "Freight"
    - "ShipperID"
    - "ShipperCompany"
    - "ShipName"
    - "ShipAddress"
    - "ShipCity"
