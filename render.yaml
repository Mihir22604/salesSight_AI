# ==============================================================================
# Render Blueprint Specification (render.yaml)
# Production Deployment for SalesSight AI Backend on Render (https://render.com)
# ==============================================================================

services:
  - type: web
    name: salessight-ai-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
